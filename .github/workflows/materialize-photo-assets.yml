name: Materialize photo assets

on:
  push:
    branches:
      - site/english-first-ai-lightroom-photos-20260809
    paths:
      - '_photo_payload2/READY'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site/english-first-ai-lightroom-photos-20260809
      - name: Decode photo assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/photography/featured
          base64 --decode _photo_payload2/direct-guangxi.b64 > assets/photography/featured/guangxi-man-cormorant-2026.avif
          base64 --decode _photo_payload2/direct-tidal.b64 > assets/photography/featured/haining-tidal-flat-worker-2025.avif
          base64 --decode _photo_payload2/direct-yunnan.b64 > assets/photography/featured/yunnan-hani-terraces-village-2023.avif
          base64 --decode _photo_payload2/direct-panorama.b64 > assets/photography/featured/hangzhou-qianjiang-panorama-2026.avif
          rm -rf _photo_payload2
          rm -f .github/workflows/materialize-photo-assets.yml
      - name: Commit binary assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/photography/featured
          git add -u -- _photo_payload2 .github/workflows/materialize-photo-assets.yml
          git commit -m 'Materialize updated watermarked photography assets'
          git push origin HEAD:site/english-first-ai-lightroom-photos-20260809
