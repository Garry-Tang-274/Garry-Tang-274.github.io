name: Refresh Qianjiang panorama

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-qianjiang-panorama.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-panorama:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download original PNG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/photography
          curl -fL --retry 3 --connect-timeout 20 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-54b4-820b-90fd-68be8a4cf834/raw?se=2026-08-05T18:32:25Z&sp=r&sv=2026-02-06&sr=b&scid=1b6aeb38-ac25-520e-aee5-927913da6493&skoid=b7fc319f-b93c-4fac-ba5f-14fdc3f9209f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-05T03:28:21Z&ske=2026-08-06T03:28:21Z&sks=b&skv=2026-02-06&sig=ln5KBJgkRTp5N2cSQehvaPPMx1cE23nvAUsdmgra4jY%3D' -o assets/photography/hangzhou-qianjiang-panorama-hq.png

      - name: Verify exact file size
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat -c%s assets/photography/hangzhou-qianjiang-panorama-hq.png)" -eq 1186461

      - name: Commit original panorama
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/photography/hangzhou-qianjiang-panorama-hq.png
          git commit -m 'Add original-quality Qianjiang panorama'
          git push
