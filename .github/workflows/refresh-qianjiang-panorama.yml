name: Refresh Qianjiang panorama

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-qianjiang-panorama.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-panorama:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update panorama markup and sizing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          page = Path('photography.md')
          text = page.read_text(encoding='utf-8')
          old = '''  <figure class="panorama-showcase">
            <img src="{{ '/assets/photography/hangzhou-qianjiang-panorama.webp?v=20260806-hq' | relative_url }}" alt="Panorama of Qianjiang Century City in Hangzhou" loading="lazy">
            <figcaption><strong>Qianjiang Century City · 钱江世纪新城</strong><span>Hangzhou, Zhejiang · 2026 · Nikon Z6 II</span></figcaption>
          </figure>'''
          new = '''  <figure class="panorama-showcase qianjiang-original">
            <a href="{{ '/assets/photography/hangzhou-qianjiang-panorama-hq.png?v=20260806-original' | relative_url }}" target="_blank" rel="noopener" aria-label="Open the original Qianjiang Century City panorama">
              <img src="{{ '/assets/photography/hangzhou-qianjiang-panorama-hq.png?v=20260806-original' | relative_url }}" alt="Panorama of Qianjiang Century City in Hangzhou" loading="lazy">
            </a>
            <figcaption><strong>Qianjiang Century City · 钱江世纪新城</strong><span>Hangzhou, Zhejiang · 2026 · Nikon Z6 II · Open original</span></figcaption>
          </figure>'''
          if old not in text:
              raise SystemExit('Expected Qianjiang panorama block not found')
          page.write_text(text.replace(old, new, 1), encoding='utf-8')

          css = Path('assets/css/portfolio-fullbleed.css')
          css_text = css.read_text(encoding='utf-8')
          marker = '/* Original-resolution Qianjiang panorama */'
          if marker not in css_text:
              css_text += '''\n\n/* Original-resolution Qianjiang panorama */
          .qianjiang-original > a {
            display: block;
            cursor: zoom-in;
          }

          .qianjiang-original img {
            width: min(100%, 2048px);
            margin: 0 auto;
          }
          '''
          css.write_text(css_text, encoding='utf-8')
          PY

      - name: Commit display changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add photography.md assets/css/portfolio-fullbleed.css
          git commit -m 'Display original Qianjiang panorama without upscaling'
          git push
