name: Refresh high-resolution portfolio images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-portfolio-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download high-resolution image batch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/photography
          curl -fL --retry 3 --connect-timeout 20 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-c18c-820b-bac1-3d8aef396179/raw?se=2026-08-05T17:55:30Z&sp=r&sv=2026-02-06&sr=b&scid=1fd923ef-8565-5295-8dd8-c34fd3723d4d&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-05T01:26:54Z&ske=2026-08-06T01:26:54Z&sks=b&skv=2026-02-06&sig=XA9SXV3WWj25kSnuKjomvMDFKavEFcNpZhhsooNe4cY%3D' -o assets/photography/hangzhou-rental-wall.webp
          curl -fL --retry 3 --connect-timeout 20 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-a480-820b-ab0c-773ff827ac91/raw?se=2026-08-05T17:55:35Z&sp=r&sv=2026-02-06&sr=b&scid=b45809c5-85b5-5ff4-9547-3a2938fb41f4&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-05T02:16:24Z&ske=2026-08-06T02:16:24Z&sks=b&skv=2026-02-06&sig=PECxvKxyBSTVyEBR4qZVp2RQQbv9YbkRwLAVjKdexP8%3D' -o assets/photography/chengdu-elder-umbrella.webp
          curl -fL --retry 3 --connect-timeout 20 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-442c-820b-87f9-b7107502ac69/raw?se=2026-08-05T17:55:42Z&sp=r&sv=2026-02-06&sr=b&scid=5a1dd297-2b02-5b87-8172-31964a0ce129&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-04T23:30:03Z&ske=2026-08-05T23:30:03Z&sks=b&skv=2026-02-06&sig=QyAPoah3VMz0GYaj3vjq2UTMtwVqQgpQCdUnDYpqM04%3D' -o assets/photography/haining-tidal-flat-worker.webp
          curl -fL --retry 3 --connect-timeout 20 'https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-ab7c-81fa-ab4a-4c04127b53e9/raw?se=2026-08-05T17:55:48Z&sp=r&sv=2026-02-06&sr=b&scid=6b297046-e716-5014-910d-5e86320f8d49&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-05T02:16:06Z&ske=2026-08-06T02:16:06Z&sks=b&skv=2026-02-06&sig=vgoC0sF/4JiJyOb%2BjudM89U7N0fEXVBRQs9cUAUtb7g%3D' -o assets/photography/chengdu-yellow-riders.webp
          curl -fL --retry 3 --connect-timeout 20 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-225c-820b-bf56-ea777be962c7/raw?se=2026-08-05T17:55:56Z&sp=r&sv=2026-02-06&sr=b&scid=596b7c18-568e-5873-a3a1-fdcd03fd1ad8&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-04T20:30:11Z&ske=2026-08-05T20:30:11Z&sks=b&skv=2026-02-06&sig=LtrSnB07YT0ISgSHDOTEjz8PtISCnJmo989LTQd9KJk%3D' -o assets/photography/haining-lakeside-dusk.webp
          curl -fL --retry 3 --connect-timeout 20 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-8ee0-820b-a799-def75d2ce8bc/raw?se=2026-08-05T17:56:03Z&sp=r&sv=2026-02-06&sr=b&scid=db4d9a68-7f38-5d8e-b66d-f1b2c928afef&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-05T01:27:24Z&ske=2026-08-06T01:27:24Z&sks=b&skv=2026-02-06&sig=ZFx7VW1UPlQDo%2BDIIwyIecMd0pkhPm5kgCMWdd0290I%3D' -o assets/photography/haining-autumn-sky.webp
          curl -fL --retry 3 --connect-timeout 20 'https://sdmntprcentralindia.oaiusercontent.com/files/00000000-4108-8208-a1cd-eeae4e979cdd/raw?se=2026-08-05T17:57:21Z&sp=r&sv=2026-02-06&sr=b&scid=63eb5a05-88d9-508e-baa1-6f5a57590273&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-04T20:37:04Z&ske=2026-08-05T20:37:04Z&sks=b&skv=2026-02-06&sig=px/BuvbKR7J0fvGfjgDy6J6V//8DojTBeoXDsXSIyqg%3D' -o assets/photography/libo-karst-panorama.webp

      - name: Verify exact file sizes
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat -c%s assets/photography/hangzhou-rental-wall.webp)" -eq 201648
          test "$(stat -c%s assets/photography/chengdu-elder-umbrella.webp)" -eq 255376
          test "$(stat -c%s assets/photography/haining-tidal-flat-worker.webp)" -eq 334158
          test "$(stat -c%s assets/photography/chengdu-yellow-riders.webp)" -eq 603500
          test "$(stat -c%s assets/photography/haining-lakeside-dusk.webp)" -eq 154432
          test "$(stat -c%s assets/photography/haining-autumn-sky.webp)" -eq 163742
          test "$(stat -c%s assets/photography/libo-karst-panorama.webp)" -eq 259926

      - name: Commit refreshed images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/photography
          if git diff --cached --quiet; then
            echo 'No image changes to commit.'
            exit 0
          fi
          git commit -m 'Replace second image batch with high-resolution copies'
          git push
