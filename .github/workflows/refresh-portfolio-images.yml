name: Refresh high-resolution portfolio images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-portfolio-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download high-resolution image batch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/photography
          curl -fL --retry 3 --connect-timeout 20 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-c2cc-820b-8f60-f746fc577877/raw?se=2026-08-05T17:58:16Z&sp=r&sv=2026-02-06&sr=b&scid=46237172-0858-559f-8fa2-372e94cf990d&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-05T00:28:54Z&ske=2026-08-06T00:28:54Z&sks=b&skv=2026-02-06&sig=YE4lR1SbN/l3zhJRLjLYu1ff0flACBx/lDtA%2BAkrk2w%3D' -o assets/photography/chengdu-rain-biker.webp
          curl -fL --retry 3 --connect-timeout 20 'https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-3100-81fa-a5c2-f89d1b279c08/raw?se=2026-08-05T17:58:23Z&sp=r&sv=2026-02-06&sr=b&scid=d8bd7413-6ada-5826-b7ce-13bd18827345&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-05T01:49:45Z&ske=2026-08-06T01:49:45Z&sks=b&skv=2026-02-06&sig=dDSi7Nf%2BW7QS6XJhfJQ7BrSS8FtDFmrcga8b%2Bj6WVaw%3D' -o assets/photography/photography-contact-sheet.webp
          curl -fL --retry 3 --connect-timeout 20 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-48f8-820b-95e9-2a262d178ef3/raw?se=2026-08-05T17:58:29Z&sp=r&sv=2026-02-06&sr=b&scid=3e020de7-a399-5dfd-ab12-e107963a8768&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-05T02:15:40Z&ske=2026-08-06T02:15:40Z&sks=b&skv=2026-02-06&sig=YrhJa/bLlIi%2BtXCuxg9/iyPUxDqO8Kf1H6xByxa7U6o%3D' -o assets/photography/hangzhou-atrium.webp
          curl -fL --retry 3 --connect-timeout 20 'https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-1578-81fa-afea-ec5ab4c251d8/raw?se=2026-08-05T17:58:34Z&sp=r&sv=2026-02-06&sr=b&scid=8fe79d14-795a-518a-8c6c-9bb0d229691c&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-05T02:56:21Z&ske=2026-08-06T02:56:21Z&sks=b&skv=2026-02-06&sig=LTDXLxiCbhL5f3O4oaM0rLzlzo9EQ56MO10Qz6pS2lo%3D' -o assets/photography/haining-autumn-light.webp
          curl -fL --retry 3 --connect-timeout 20 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-894c-820b-8dc7-4cb3f3bc55d5/raw?se=2026-08-05T17:58:39Z&sp=r&sv=2026-02-06&sr=b&scid=75fe9c4b-886d-5403-ad01-4e28bccbcbd4&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-05T00:33:17Z&ske=2026-08-06T00:33:17Z&sks=b&skv=2026-02-06&sig=U/Nz2VwG0IUZi%2B9nGCsvLG9aGelb0fey7GPBVdvac3k%3D' -o assets/photography/haining-autumn-leaf.webp
          curl -fL --retry 3 --connect-timeout 20 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-e82c-820b-9663-cf2f7e452770/raw?se=2026-08-05T17:58:45Z&sp=r&sv=2026-02-06&sr=b&scid=7df9ce90-e0c0-5453-b2b6-20e3393498ec&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-05T02:15:41Z&ske=2026-08-06T02:15:41Z&sks=b&skv=2026-02-06&sig=wo37QCm6hmAwTdB4obzKa79gK4kXuzqHBzRp2tJ4uso%3D' -o assets/photography/xinjiang-lake-road.webp

      - name: Verify exact file sizes
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat -c%s assets/photography/chengdu-rain-biker.webp)" -eq 188406
          test "$(stat -c%s assets/photography/photography-contact-sheet.webp)" -eq 232800
          test "$(stat -c%s assets/photography/hangzhou-atrium.webp)" -eq 182324
          test "$(stat -c%s assets/photography/haining-autumn-light.webp)" -eq 205274
          test "$(stat -c%s assets/photography/haining-autumn-leaf.webp)" -eq 649134
          test "$(stat -c%s assets/photography/xinjiang-lake-road.webp)" -eq 392064

      - name: Commit refreshed images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/photography
          if git diff --cached --quiet; then
            echo 'No image changes to commit.'
            exit 0
          fi
          git commit -m 'Replace final image batch with high-resolution copies'
          git push
