<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>怪玩具盒 · 18 个小世界</title>
<style>
:root{--bg:#0d0e12;--panel:#15171d;--panel2:#1b1e26;--ink:#f2f0e8;--muted:#9da1ad;--line:#2a2e38;--accent:#d8ff72;--accent2:#73ddff;--warn:#ff8f70;--shadow:0 20px 60px rgba(0,0,0,.35)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100%}body{overflow-x:hidden}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.shell{max-width:1180px;margin:auto;padding:28px 18px 80px}.top{display:flex;gap:18px;align-items:flex-end;justify-content:space-between;margin-bottom:28px}.kicker{font-size:12px;letter-spacing:.18em;color:var(--accent)}h1{font-size:clamp(34px,6vw,76px);line-height:.93;margin:8px 0 10px;letter-spacing:-.055em}.sub{color:var(--muted);max-width:640px;font-size:15px;line-height:1.7}.count{font-size:14px;color:var(--muted);white-space:nowrap}
.toolbar{position:sticky;top:0;z-index:10;background:linear-gradient(var(--bg) 72%,transparent);padding:10px 0 20px;display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#13151a;color:var(--muted);padding:9px 13px;border-radius:999px}.chip.active,.chip:hover{color:var(--ink);border-color:#596171;background:#1b1e26}.random{margin-left:auto;border-color:#48531e;color:#eaff9e}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{position:relative;min-height:210px;border:1px solid var(--line);background:linear-gradient(155deg,#191c23,#121419);padding:18px;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:.2s transform,.2s border-color}.card:hover{transform:translateY(-3px);border-color:#48505f}.num{font:12px ui-monospace,SFMono-Regular,monospace;color:#7c8190}.card h2{font-size:25px;margin:26px 0 5px;letter-spacing:-.03em}.card p{font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 18px}.tags{margin-top:auto;font-size:11px;color:#737887}.go{position:absolute;right:15px;bottom:15px;border:none;background:var(--accent);color:#12150b;width:36px;height:36px;border-radius:50%;font-size:20px}.new::after{content:"NEW";position:absolute;right:14px;top:14px;color:#111;background:var(--accent2);font:700 10px ui-monospace;padding:4px 7px;border-radius:99px}
.toy{position:fixed;inset:0;z-index:50;background:#0b0c10;display:none;overflow:auto}.toy.open{display:block}.toybar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(11,12,16,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.back,.ghost,.primary,.danger{border:1px solid var(--line);background:#171a20;color:var(--ink);padding:10px 14px;border-radius:11px}.primary{background:var(--accent);color:#0e1206;border-color:transparent;font-weight:700}.danger{border-color:#6e3529;color:#ffb19f}.toyname{font-weight:700}.toybody{max-width:1050px;margin:0 auto;padding:24px 16px 80px}.toyhead{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:20px}.toyhead h2{font-size:clamp(32px,5vw,58px);letter-spacing:-.05em;margin:0 0 8px}.toyhead p{color:var(--muted);line-height:1.6;margin:0;max-width:620px}.panel{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:16px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.stack{display:grid;gap:12px}.two{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:12px;border:1px solid var(--line);border-radius:13px;background:#111318}.stat b{font-size:24px}.stat small{display:block;color:var(--muted);margin-top:4px}.canvaswrap{position:relative;border-radius:16px;overflow:hidden;background:#080a0f;border:1px solid var(--line)}canvas{width:100%;display:block;touch-action:none}.hint{font-size:12px;color:var(--muted);line-height:1.6}.quote{font-family:ui-serif,Georgia,"Songti SC",serif;font-size:22px;line-height:1.65}.badge{display:inline-block;border:1px solid var(--line);padding:5px 9px;border-radius:999px;color:var(--muted);font-size:11px}.meter{height:8px;background:#0d0f13;border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;background:var(--accent);width:50%}.bigcenter{min-height:340px;display:grid;place-items:center;text-align:center}.bigcenter .huge{font-size:70px;line-height:1}.film{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.film img{width:150px;border-radius:8px;border:1px solid var(--line)}.keygrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}.key{height:110px;border:1px solid var(--line);background:#eef0e8;color:#111;border-radius:8px 8px 13px 13px}.key:nth-child(2n){background:#c8cbd0}.casebuttons,.choicegrid{display:grid;gap:8px}.casebuttons button,.choicegrid button{padding:13px;text-align:left;border:1px solid var(--line);background:#111318;color:var(--ink);border-radius:12px}.casebuttons button:hover,.choicegrid button:hover{border-color:#5b6371}.freq{width:100%}.log{font:13px ui-monospace,SFMono-Regular,monospace;color:#aeb4c0;white-space:pre-wrap;line-height:1.6}.starname,input[type=text],textarea{width:100%;background:#0e1015;border:1px solid var(--line);border-radius:11px;padding:11px;color:var(--ink)}textarea{min-height:130px;resize:vertical}.objectgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.object{min-height:88px;border:1px solid var(--line);border-radius:13px;background:#111318;color:var(--ink);padding:10px}.object.sel{outline:2px solid var(--accent)}.reaction{min-height:360px;border-radius:18px;display:grid;place-items:center;text-align:center;border:1px solid var(--line);background:#15171d;user-select:none}.reaction.ready{background:#14281b}.reaction.wait{background:#221c13}.reaction.fail{background:#321714}.steps{overflow:auto}.stepgrid{display:grid;grid-template-columns:62px repeat(16,30px);gap:4px;min-width:610px}.cell{height:30px;border-radius:6px;border:1px solid #353a46;background:#101217}.cell.on{background:var(--accent);border-color:var(--accent)}.labelcell{display:flex;align-items:center;color:var(--muted);font-size:12px}.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:520px;margin:auto}.mcell{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:#161922}.mcell.flash{background:var(--accent2);box-shadow:0 0 30px rgba(115,221,255,.4)}.drawers{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.drawer{min-height:110px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(#171a20,#101216);color:var(--ink);padding:10px}.drawer.opened{background:#22251b;border-color:#657331}.illusionTabs{display:flex;gap:7px;flex-wrap:wrap}.illusionTabs button{padding:8px 11px;border:1px solid var(--line);background:#111318;color:var(--muted);border-radius:999px}.illusionTabs button.active{color:var(--ink);border-color:#5d6676}.small{font-size:12px;color:var(--muted)}
@media(max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.objectgrid{grid-template-columns:repeat(3,1fr)}.top{align-items:flex-start;flex-direction:column}.random{margin-left:0}.card{min-height:190px}.drawers{grid-template-columns:repeat(3,1fr)}}
@media(max-width:520px){.stepgrid{grid-template-columns:44px repeat(16,16px);gap:2px;min-width:0}.cell{height:25px}.labelcell{font-size:9px}.shell{padding:22px 12px 60px}.grid{grid-template-columns:1fr}.card{min-height:170px}.card h2{margin-top:20px}.toybody{padding:18px 12px 70px}.toyhead{display:block}.objectgrid{grid-template-columns:repeat(2,1fr)}.drawers{grid-template-columns:repeat(2,1fr)}.keygrid{grid-template-columns:repeat(4,1fr)}.key{height:78px}.three{grid-template-columns:1fr 1fr}.reaction{min-height:300px}}
</style>
</head>
<body>
<main class="shell">
  <header class="top">
    <div><div class="kicker">YOUR LITTLE PLAYGROUND / VOL. 05</div><h1>怪玩具盒</h1><div class="sub">十八个小世界，一个网页。想动手就画点东西，想动脑就判个案，想发呆就养生态，想刺激就测反应。没有任务，没有进度条必须完成。</div></div>
    <div class="count">18 / TOYS</div>
  </header>
  <div class="toolbar" id="filters">
    <button class="chip active" data-filter="all">全部</button><button class="chip" data-filter="new">新来的 10</button><button class="chip" data-filter="make">想动手</button><button class="chip" data-filter="think">想动脑</button><button class="chip" data-filter="chill">想放空</button><button class="chip" data-filter="game">来一局</button><button class="chip random" id="randomBtn">帮我挑一个</button>
  </div>
  <section class="grid" id="cards"></section>
</main>
<section class="toy" id="toy"><div class="toybar"><button class="back" id="backBtn">← 回到玩具盒</button><span class="toyname" id="toyname"></span><span style="margin-left:auto" class="small">状态保存在本机浏览器</span></div><div class="toybody" id="toybody"></div></section>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const toys=[
{id:'photo',n:'01',title:'决定性一瞬',cat:['make','game'],desc:'等人、光和飞鸟，恰好落进同一张照片。六张一卷。',tag:'摄影抓拍'},
{id:'civ',n:'02',title:'纸上文明',cat:['think'],desc:'八个季节，几次取舍，看看你的选择会养出什么样的小城。',tag:'轻策略推演'},
{id:'kaleido',n:'03',title:'万花筒画室',cat:['make','chill'],desc:'随手画一笔，让它在镜像里开成花。',tag:'对称绘画'},
{id:'garden',n:'04',title:'瓶中天气',cat:['chill','make'],desc:'种下植物，安排一场雨，陪蜗牛等天黑。',tag:'慢慢养世界'},
{id:'synth',n:'05',title:'手指合成器',cat:['make','chill'],desc:'弹八个音，把一小段循环叠成自己的声音。',tag:'声音与光'},
{id:'court',n:'06',title:'不太合理法庭',cat:['think'],desc:'闹钟、冰箱和镜子都来起诉人类。现在，你来判。',tag:'荒诞选择叙事'},
{id:'radio',n:'07',title:'深空电台',cat:['chill','think'],desc:'转动频率，收集深夜广播里没说完的话。',tag:'合成音乐与故事'},
{id:'gravity',n:'08',title:'垃圾引力',cat:['game'],desc:'拖着飞船捡垃圾，借一点惯性，把废品甩进回收环。',tag:'物理回收街机'},
{id:'timeslice',n:'09',title:'时间切片机',cat:['new','make','chill'],desc:'把运动拆成残影，调慢、冻结，再看时间叠在一起。',tag:'时间可视化',new:true},
{id:'observatory',n:'10',title:'夜班天文台',cat:['new','make','chill'],desc:'从一片虚构星空里连出自己的星座，再给它命名。',tag:'造星座',new:true},
{id:'lost',n:'11',title:'失物招领处',cat:['new','think','chill'],desc:'每件失物都有一段不太可靠的故事；两件放一起更离谱。',tag:'微型故事机',new:true},
{id:'reaction',n:'12',title:'反应实验室',cat:['new','game'],desc:'灯变绿就点。别抢跑。它会认真记录你到底有多快。',tag:'反应力',new:true},
{id:'ecosystem',n:'13',title:'微型生态缸',cat:['new','chill','think'],desc:'调光、调水、放进捕食者，看一个小生态自己找平衡。',tag:'生态模拟',new:true},
{id:'drum',n:'14',title:'轨道鼓机',cat:['new','make','game'],desc:'十六步，四条轨道，点几格就让一颗小卫星开始打拍子。',tag:'步进音序器',new:true},
{id:'memory',n:'15',title:'记忆拼片',cat:['new','game','think'],desc:'它亮一串，你照着点回来。每一轮都多一格。',tag:'短时记忆',new:true},
{id:'drawers',n:'16',title:'命运抽屉',cat:['new','chill'],desc:'十二个抽屉，里面不是答案，是一些今天可能值得做的小怪事。',tag:'随机微任务',new:true},
{id:'glitch',n:'17',title:'语言故障机',cat:['new','make','think'],desc:'丢一句话进去，把它拆坏、镜像、删词，再拼成另一句话。',tag:'文本变形',new:true},
{id:'illusion',n:'18',title:'视觉错觉实验室',cat:['new','think','chill'],desc:'眼睛说它们不一样，尺子说它们一样。动手拆穿几种错觉。',tag:'知觉实验',new:true}
];
let cleanup=[]; function onCleanup(fn){cleanup.push(fn)} function closeToy(){cleanup.forEach(f=>{try{f()}catch{}});cleanup=[];$('#toy').classList.remove('open');document.body.style.overflow=''}
function renderCards(filter='all'){const box=$('#cards');box.innerHTML='';toys.filter(t=>filter==='all'||t.cat.includes(filter)).forEach(t=>{const d=document.createElement('article');d.className='card '+(t.new?'new':'');d.innerHTML=`<div class="num">${t.n} / ${t.tag}</div><h2>${t.title}</h2><p>${t.desc}</p><div class="tags">${t.cat.filter(x=>x!=='new').map(x=>({make:'动手',think:'动脑',chill:'放空',game:'游戏'}[x])).join(' · ')}</div><button class="go" aria-label="打开">↗</button>`;d.onclick=()=>openToy(t.id);box.appendChild(d)})}
$('#filters').addEventListener('click',e=>{if(!e.target.dataset.filter)return;$$('.chip[data-filter]').forEach(x=>x.classList.remove('active'));e.target.classList.add('active');renderCards(e.target.dataset.filter)});$('#randomBtn').onclick=()=>openToy(toys[Math.floor(Math.random()*toys.length)].id);$('#backBtn').onclick=closeToy;renderCards();
function head(t,desc,extra=''){return `<div class="toyhead"><div><span class="badge">${t.n} / ${t.tag}</span><h2>${t.title}</h2><p>${desc||t.desc}</p></div>${extra}</div>`}
function openToy(id){cleanup.forEach(f=>{try{f()}catch{}});cleanup=[];const t=toys.find(x=>x.id===id);$('#toyname').textContent=t.title;$('#toybody').innerHTML='';$('#toy').classList.add('open');document.body.style.overflow='hidden';window.scrollTo(0,0);builders[id](t)}
function fitCanvas(c,h=520){const w=Math.min(c.parentElement.clientWidth||800,1000),dpr=Math.min(devicePixelRatio,2);c.width=w*dpr;c.height=h*dpr;c.style.height=h+'px';const ctx=c.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);return {ctx,w,h}}
function audioCtx(){window.__ac=window.__ac||new (window.AudioContext||window.webkitAudioContext)();if(window.__ac.state==='suspended')window.__ac.resume();return window.__ac}
function beep(freq=440,dur=.12,type='sine',gain=.05,when=0){const ac=audioCtx(),o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(gain,ac.currentTime+when);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+when+dur);o.connect(g).connect(ac.destination);o.start(ac.currentTime+when);o.stop(ac.currentTime+when+dur+.02)}
function saveData(k,v){try{localStorage.setItem('toybox_'+k,JSON.stringify(v))}catch{}} function loadData(k,d){try{return JSON.parse(localStorage.getItem('toybox_'+k))??d}catch{return d}}

const builders={};
builders.photo=t=>{const b=$('#toybody');b.innerHTML=head(t,'街不会等你。六张胶片，按下快门以后不能撤回。')+`<div class="two"><div class="panel"><div class="canvaswrap"><canvas id="pc"></canvas></div><div class="row" style="margin-top:10px"><button class="primary" id="shutter">● 快门</button><button class="ghost" id="pauseP">暂停街道</button><span class="small" id="filmcount">0 / 6</span></div></div><div class="panel stack"><b>这一卷</b><div class="film" id="film"></div><div class="hint">提示：试着等两三个运动方向不同的人物同时进入画面。构图分数只是游戏，不是摄影规则。</div></div></div>`;const c=$('#pc');let {ctx,w,h}=fitCanvas(c,430),paused=false,shots=[],alive=true;onCleanup(()=>alive=false);let people=Array.from({length:7},(_,i)=>({x:Math.random()*w,y:260+Math.random()*105,v:(.5+Math.random()*1.1)*(i%2?1:-1),r:7+Math.random()*8,col:['#ff6f61','#e9d66b','#70d6ff','#efefef'][i%4]}));function draw(){if(!alive)return;ctx.fillStyle='#c9b99a';ctx.fillRect(0,0,w,h);ctx.fillStyle='#6b665d';ctx.fillRect(0,290,w,140);ctx.fillStyle='#32343a';ctx.fillRect(0,350,w,80);ctx.fillStyle='#2b2d31';for(let i=0;i<6;i++){ctx.fillRect(i*w/6+15,70,80,180)}ctx.fillStyle='#a84335';ctx.fillRect(w*.62,150,140,25);ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(w/3,0);ctx.lineTo(w/3,h);ctx.moveTo(2*w/3,0);ctx.lineTo(2*w/3,h);ctx.moveTo(0,h/3);ctx.lineTo(w,h/3);ctx.moveTo(0,2*h/3);ctx.lineTo(w,2*h/3);ctx.stroke();people.forEach((p,i)=>{if(!paused){p.x+=p.v;if(p.x<-30)p.x=w+30;if(p.x>w+30)p.x=-30}ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#202126';ctx.beginPath();ctx.moveTo(p.x,p.y+p.r);ctx.lineTo(p.x-p.v*5,p.y+p.r+20);ctx.stroke()});ctx.fillStyle='#202126';for(let i=0;i<4;i++){let bx=(Date.now()/25*(i+1))%(w+100)-50;ctx.beginPath();ctx.arc(bx,70+i*12,2.2,0,6.28);ctx.fill()}requestAnimationFrame(draw)}draw();$('#pauseP').onclick=()=>{paused=!paused;$('#pauseP').textContent=paused?'继续街道':'暂停街道'};$('#shutter').onclick=()=>{if(shots.length>=6)return;beep(110,.04,'square',.04);const url=c.toDataURL('image/jpeg',.88);shots.push(url);const img=new Image();img.src=url;$('#film').appendChild(img);$('#filmcount').textContent=shots.length+' / 6';if(shots.length===6)$('#shutter').disabled=true};};

builders.civ=t=>{let s=loadData('civ',{turn:0,food:55,happy:55,know:45,nature:60,history:[]});const events=[['开垦河滩','食物增加，但河岸变得拥挤。',[18,-2,0,-13]],['建借书屋','人们晚上有地方待，知识增长。',[-3,7,17,0]],['修石桥','来往方便，旧渡口消失。',[5,8,5,-5]],['留公共花园','几乎不产粮，但大家更愿意停下来。',[-6,14,0,15]],['引入工坊','生产更快，也更吵。',[9,-5,10,-10]],['建立夜校','知识上升，需要占用一部分粮食。',[-8,8,16,0]],['封存湿地','少一块建设用地，多一块活着的水。',[-5,5,0,20]],['办秋日集市','库存消耗，但城里突然像一座城。',[-10,18,4,-2]]];const b=$('#toybody');function view(){b.innerHTML=head(t,'每季只做一次决定。没有最优解，最后只会得到一座更像你选择的小城。')+`<div class="two"><div class="panel stack"><div class="row"><span class="badge">第 ${Math.min(s.turn+1,8)} / 8 季</span><button class="ghost" id="resetC">重开</button></div><div id="choices" class="choicegrid"></div></div><div class="panel stack"><div class="three"><div class="stat"><b>${s.food}</b><small>粮食</small></div><div class="stat"><b>${s.happy}</b><small>幸福</small></div><div class="stat"><b>${s.know}</b><small>知识</small></div><div class="stat"><b>${s.nature}</b><small>自然</small></div></div><div class="log">${s.history.map((x,i)=>`${i+1}. ${x}`).join('\n')||'城还很小。'}</div></div></div>`;$('#resetC').onclick=()=>{s={turn:0,food:55,happy:55,know:45,nature:60,history:[]};saveData('civ',s);view()};const box=$('#choices');if(s.turn>=8){const vals={粮食:s.food,幸福:s.happy,知识:s.know,自然:s.nature};let top=Object.entries(vals).sort((a,b)=>b[1]-a[1])[0][0];box.innerHTML=`<div class="quote">八季结束。你的城最看重的是「${top}」。它不完美，但已经有了自己的脾气。</div>`;return}const base=events[s.turn];[base,['什么也不建','把资源留给下一季。',[4,2,1,5]],['邀请外来匠人','变化更快，也更难预测。',[2,6,10,-3]]].forEach((e,j)=>{const bt=document.createElement('button');bt.innerHTML=`<b>${e[0]}</b><div class="small">${e[1]}</div>`;bt.onclick=()=>{let d=e[2];s.food=Math.max(0,s.food+d[0]);s.happy=Math.max(0,s.happy+d[1]);s.know=Math.max(0,s.know+d[2]);s.nature=Math.max(0,s.nature+d[3]);s.history.push(e[0]);s.turn++;saveData('civ',s);view()};box.appendChild(bt)})}view()};

builders.kaleido=t=>{const b=$('#toybody');b.innerHTML=head(t,'按住画布拖动。每一笔会被镜像复制。')+`<div class="panel"><div class="row"><label>镜像 <select id="sym"><option>4</option><option selected>8</option><option>12</option></select></label><button class="ghost" id="clearK">清空</button><button class="ghost" id="randK">随机起图</button><button class="primary" id="saveK">生成图片</button></div><div class="canvaswrap" style="margin-top:12px"><canvas id="kc"></canvas></div><div id="saveArea" style="margin-top:10px"></div></div>`;const c=$('#kc');let {ctx,w,h}=fitCanvas(c,620),down=false,last=null,sym=8;function bg(){ctx.fillStyle='#0b0d12';ctx.fillRect(0,0,w,h)}bg();$('#sym').onchange=e=>sym=+e.target.value;function pt(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*w/r.width,y:(e.clientY-r.top)*h/r.height}}function stroke(a,p){let cx=w/2,cy=h/2,ax=a.x-cx,ay=a.y-cy,px=p.x-cx,py=p.y-cy;for(let i=0;i<sym;i++){let ang=i*Math.PI*2/sym,co=Math.cos(ang),si=Math.sin(ang);let A={x:cx+ax*co-ay*si,y:cy+ax*si+ay*co},P={x:cx+px*co-py*si,y:cy+px*si+py*co};ctx.strokeStyle=`hsl(${(Date.now()/35+i*25)%360} 85% 70%)`;ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(P.x,P.y);ctx.stroke();ctx.beginPath();ctx.moveTo(2*cx-A.x,A.y);ctx.lineTo(2*cx-P.x,P.y);ctx.stroke()}}c.onpointerdown=e=>{down=true;last=pt(e);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!down)return;let p=pt(e);stroke(last,p);last=p};c.onpointerup=()=>down=false;$('#clearK').onclick=bg;$('#randK').onclick=()=>{for(let i=0;i<90;i++){let a={x:w/2+Math.random()*120,y:h/2+Math.random()*120},p={x:a.x+(Math.random()-.5)*40,y:a.y+(Math.random()-.5)*40};stroke(a,p)}};$('#saveK').onclick=()=>{$('#saveArea').innerHTML=`<img alt="万花筒作品" style="max-width:280px;width:100%;border-radius:12px" src="${c.toDataURL('image/png')}"><div class="small">长按图片即可保存。</div>`}};

builders.garden=t=>{let st=loadData('garden',{plants:[],night:false,weather:'晴'});const b=$('#toybody');b.innerHTML=head(t,'这个瓶子不会催你。点种子，换天气，等它慢慢长。')+`<div class="two"><div class="panel"><div class="canvaswrap"><canvas id="gc"></canvas></div></div><div class="panel stack"><div class="row"><button class="primary seed" data-k="fern">种蕨叶</button><button class="ghost seed" data-k="flower">种花</button><button class="ghost seed" data-k="mush">种蘑菇</button></div><div class="row"><button class="ghost weather" data-k="晴">晴</button><button class="ghost weather" data-k="雨">雨</button><button class="ghost weather" data-k="风">风</button><button class="ghost" id="night">昼 / 夜</button></div><button class="danger" id="resetG">清空瓶子</button><div class="hint">刷新网页以后植物还在。蘑菇在夜里会发一点光。</div></div></div>`;const c=$('#gc');let {ctx,w,h}=fitCanvas(c,600),alive=true;onCleanup(()=>alive=false);function draw(){if(!alive)return;let g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,st.night?'#0a1630':'#a9d5e8');g.addColorStop(1,st.night?'#101b22':'#d9c8a2');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=3;ctx.strokeRect(20,20,w-40,h-40);ctx.fillStyle='#443b2f';ctx.fillRect(22,h-110,w-44,88);st.plants.forEach((p,i)=>{let x=p.x*w,y=h-108-p.size;ctx.strokeStyle='#567b4f';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,h-105);ctx.lineTo(x,y);ctx.stroke();if(p.kind==='fern'){ctx.fillStyle='#6f9d61';for(let k=0;k<5;k++){ctx.beginPath();ctx.ellipse(x+(k%2?10:-10),y+k*8,12,4,k%2?.5:-.5,0,6.28);ctx.fill()}}else if(p.kind==='flower'){ctx.fillStyle=['#ffd166','#ff7aa8','#d9a7ff'][i%3];for(let a=0;a<6;a++){ctx.beginPath();ctx.arc(x+Math.cos(a)*7,y+Math.sin(a)*7,5,0,6.28);ctx.fill()}}else{ctx.fillStyle=st.night?'#baffd5':'#d8e2dc';ctx.beginPath();ctx.arc(x,y,10,Math.PI,0);ctx.fill();ctx.fillRect(x-2,y,4,12)}});if(st.weather==='雨'){ctx.strokeStyle='rgba(160,210,255,.55)';for(let i=0;i<70;i++){let x=Math.random()*w,y=Math.random()*h;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-5,y+12);ctx.stroke()}}if(st.weather==='风'){ctx.strokeStyle='rgba(255,255,255,.3)';for(let i=0;i<10;i++){let y=80+i*42;ctx.beginPath();ctx.moveTo(60,y);ctx.bezierCurveTo(w*.3,y-18,w*.6,y+18,w-60,y);ctx.stroke()}}ctx.fillStyle=st.night?'#dbe7ff':'#473e34';ctx.font='22px serif';ctx.fillText(st.night?'☾':'☀',w-65,60);ctx.font='18px serif';ctx.fillText('🐌',55,h-70);requestAnimationFrame(draw)}draw();$$('.seed').forEach(bt=>bt.onclick=()=>{st.plants.push({kind:bt.dataset.k,x:.1+Math.random()*.8,size:35+Math.random()*85});saveData('garden',st)});$$('.weather').forEach(bt=>bt.onclick=()=>{st.weather=bt.dataset.k;saveData('garden',st)});$('#night').onclick=()=>{st.night=!st.night;saveData('garden',st)};$('#resetG').onclick=()=>{st.plants=[];saveData('garden',st)}};

builders.synth=t=>{const b=$('#toybody');b.innerHTML=head(t,'先随便弹。想留下一段时，再开录音。')+`<div class="panel stack"><div class="row"><button class="primary" id="recS">● 录制 8 秒</button><button class="ghost" id="playS">循环回放</button><button class="ghost" id="stopS">停止</button><span class="small" id="smsg">还没有录音</span></div><div class="keygrid" id="keys"></div></div>`;const freqs=[261.63,293.66,329.63,349.23,392,440,493.88,523.25];let rec=false,start=0,events=[],loop=null;const keys=$('#keys');freqs.forEach((f,i)=>{let bt=document.createElement('button');bt.className='key';bt.textContent=['C','D','E','F','G','A','B','C'][i];bt.onpointerdown=()=>{beep(f,.35,i%2?'triangle':'sine',.07);if(rec)events.push({i,t:performance.now()-start})};keys.appendChild(bt)});$('#recS').onclick=()=>{events=[];rec=true;start=performance.now();$('#smsg').textContent='录音中…';setTimeout(()=>{rec=false;$('#smsg').textContent=`录到 ${events.length} 个音`},8000)};$('#playS').onclick=()=>{clearInterval(loop);const run=()=>events.forEach(e=>setTimeout(()=>beep(freqs[e.i],.3,'sine',.05),e.t));run();loop=setInterval(run,8000);onCleanup(()=>clearInterval(loop))};$('#stopS').onclick=()=>{clearInterval(loop);loop=null}};

builders.court=t=>{const cases=[['闹钟诉人类','原告：我每天按时响。被告：我每天按时把我按掉。','判人类有罪','判闹钟扰民','双方各退五分钟'],['冰箱诉深夜','原告：他半夜开门七次，什么都没拿。','限制夜间开门','冰箱不得发光','驳回，属于情绪巡逻'],['镜子诉自拍者','原告：他只相信前置摄像头，不相信我。','镜子胜诉','摄像头胜诉','要求同框和解'],['椅子诉衣服','原告：我不是衣柜，但他们都把我当衣柜。','清空椅背','承认椅子兼职衣柜','每周休息一天'],['待办清单诉星期一','原告：每到周一，我就突然多出二十项。','限制周一新增','清单承担情绪劳动','判星期二补偿'],['昨天诉明天','原告：所有人都说以后再做，没人回头谢我。','昨天胜诉','明天胜诉','今天接管案件']];let s=loadData('court',{i:0,verdicts:[]});const b=$('#toybody');function view(){const c=cases[Math.min(s.i,cases.length-1)];b.innerHTML=head(t,'六个案子。判决没有正确答案，但后面的案件会记住你的脾气。')+`<div class="two"><div class="panel stack"><span class="badge">CASE ${Math.min(s.i+1,6)} / 06</span><div class="quote">${s.i<6?c[0]:'庭审结束'}</div><div>${s.i<6?c[1]:'书记员正在整理你的司法风格。'}</div><div class="casebuttons" id="vb"></div></div><div class="panel"><b>判决记录</b><div class="log" style="margin-top:12px">${s.verdicts.map((v,i)=>`${i+1}. ${v}`).join('\n')||'暂无'}</div><button class="danger" id="resetCourt" style="margin-top:15px">销毁卷宗 / 重开</button></div></div>`;$('#resetCourt').onclick=()=>{s={i:0,verdicts:[]};saveData('court',s);view()};if(s.i>=6){$('#vb').innerHTML=`<div class="quote">你的法庭偏好：${s.verdicts.filter(x=>x.includes('胜诉')||x.includes('有罪')).length>2?'重证据':'重和解'}。至于这是不是好法官，卷宗拒绝评价。</div>`;return}c.slice(2).forEach(v=>{let bt=document.createElement('button');bt.textContent=v;bt.onclick=()=>{s.verdicts.push(v);s.i++;saveData('court',s);view()};$('#vb').appendChild(bt)})}view()};

builders.radio=t=>{const stations=[{f:88.8,n:'轨道唱片行',m:'今晚到货十二张旧 CD：十一张没有封面，一张只有封面。老板坚持说“完整”。'},{f:91.7,n:'月背排练室',m:'鼓手迟到四十七分钟，因为他坚持月球没有“迟到”这个概念。'},{f:96.4,n:'雨层交通台',m:'三号云层缓行。请勿从闪电左侧超车。'},{f:101.2,n:'失眠者热线',m:'有人问：如果我凌晨三点决定明早六点起床，哪一个我才是真正的我？'},{f:106.6,n:'无人回收站',m:'今天收到：一只宇航靴、半本哲学导论，以及一句没说完的道歉。'},{f:109.1,n:'最后一张唱片',m:'如果你听见这里，说明你已经把噪声也当成了节目的一部分。'}];const b=$('#toybody');b.innerHTML=head(t,'拖动频率。接近电台时，噪声会变成一句完整的话。')+`<div class="two"><div class="panel stack"><input class="freq" type="range" min="87" max="110" step="0.1" value="88.8" id="freq"><div class="stat"><b id="fv">88.8</b><small>MHz</small></div><button class="ghost" id="toneR">打开 / 关闭背景音</button></div><div class="panel"><div class="quote" id="rname">轨道唱片行</div><p id="rmsg"></p></div></div>`;let osc=null,g=null;function tune(){let f=+$('#freq').value;$('#fv').textContent=f.toFixed(1);let near=stations.map(s=>({...s,d:Math.abs(s.f-f)})).sort((a,b)=>a.d-b.d)[0];if(near.d<.35){$('#rname').textContent=near.n;$('#rmsg').textContent=near.m}else{$('#rname').textContent='……沙沙……';$('#rmsg').textContent='没有台。也许这段空白本身就是节目。'}if(osc)osc.frequency.value=130+(f-87)*7}$('#freq').oninput=tune;tune();$('#toneR').onclick=()=>{if(osc){osc.stop();osc=null;return}const ac=audioCtx();osc=ac.createOscillator();g=ac.createGain();osc.type='triangle';osc.frequency.value=145;g.gain.value=.018;osc.connect(g).connect(ac.destination);osc.start();onCleanup(()=>{try{osc&&osc.stop()}catch{}})}};

builders.gravity=t=>{const b=$('#toybody');b.innerHTML=head(t,'按住画面拖动飞船，靠近废品会吸住。把废品带进右上角回收环。')+`<div class="panel"><div class="row"><button class="primary" id="startGr">开始 60 秒</button><span class="small" id="grscore">0 分</span><span class="small" id="grtime">60 秒</span></div><div class="canvaswrap" style="margin-top:10px"><canvas id="grc"></canvas></div></div>`;const c=$('#grc');let {ctx,w,h}=fitCanvas(c,560),ship={x:w*.3,y:h*.55},junk=[],score=0,time=60,active=false,drag=false,timer=null,alive=true;onCleanup(()=>alive=false);function resetJ(){junk=Array.from({length:12},()=>({x:30+Math.random()*(w-60),y:60+Math.random()*(h-100),vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5}))}resetJ();function pos(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*w/r.width,y:(e.clientY-r.top)*h/r.height}}c.onpointerdown=e=>{drag=true;c.setPointerCapture(e.pointerId);ship=pos(e)};c.onpointermove=e=>{if(drag)ship=pos(e)};c.onpointerup=()=>drag=false;function draw(){if(!alive)return;ctx.fillStyle='#070910';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#6af0cf';ctx.lineWidth=4;ctx.beginPath();ctx.arc(w-80,80,45,0,6.28);ctx.stroke();ctx.fillStyle='#d8ff72';ctx.beginPath();ctx.moveTo(ship.x+15,ship.y);ctx.lineTo(ship.x-12,ship.y-8);ctx.lineTo(ship.x-8,ship.y+10);ctx.fill();junk.forEach(j=>{let dx=ship.x-j.x,dy=ship.y-j.y,d=Math.hypot(dx,dy);if(active&&d<115){j.vx+=dx/d*.025;j.vy+=dy/d*.025}j.x+=j.vx;j.y+=j.vy;if(j.x<5||j.x>w-5)j.vx*=-1;if(j.y<5||j.y>h-5)j.vy*=-1;ctx.fillStyle='#8f96a6';ctx.fillRect(j.x-7,j.y-7,14,14);if(active&&Math.hypot(j.x-(w-80),j.y-80)<40){score+=10;$('#grscore').textContent=score+' 分';j.x=Math.random()*w*.6;j.y=100+Math.random()*(h-130);j.vx=(Math.random()-.5)*.5;j.vy=(Math.random()-.5)*.5;beep(660,.07,'square',.04)}});requestAnimationFrame(draw)}draw();$('#startGr').onclick=()=>{score=0;time=60;active=true;clearInterval(timer);timer=setInterval(()=>{time--;$('#grtime').textContent=time+' 秒';if(time<=0){active=false;clearInterval(timer);$('#grtime').text builders.timeslice=t=>{const b=$('#toybody');b.innerHTML=head(t,'这不是录像回放，而是一台“把现在复制很多次”的机器。')+`<div class="panel stack"><div class="row"><label>速度 <input id="tsSpeed" type="range" min="0" max="2" step="0.05" value="1"></label><label>残影 <input id="tsTrail" type="range" min="2" max="40" value="18"></label><button class="ghost" id="tsFreeze">冻结</button></div><div class="canvaswrap"><canvas id="tsc"></canvas></div><div class="hint">速度归零时，世界停下，但之前的时间仍留在画面里。</div></div>`;const c=$('#tsc');let {ctx,w,h}=fitCanvas(c,560),speed=1,trail=18,freeze=false,history=[],alive=true;onCleanup(()=>alive=false);let objs=Array.from({length:6},(_,i)=>({x:Math.random()*w,y:80+Math.random()*(h-160),vx:(.7+Math.random()*1.6)*(i%2?1:-1),vy:(Math.random()-.5)*.5,c:`hsl(${i*55} 80% 65%)`}));$('#tsSpeed').oninput=e=>speed=+e.target.value;$('#tsTrail').oninput=e=>trail=+e.target.value;$('#tsFreeze').onclick=()=>freeze=!freeze;function loop(){if(!alive)return;if(!freeze){objs.forEach(o=>{o.x+=o.vx*speed;o.y+=o.vy*speed;if(o.x<0||o.x>w)o.vx*=-1;if(o.y<30||o.y>h-30)o.vy*=-1});history.push(objs.map(o=>({...o})));while(history.length>trail)history.shift()}ctx.fillStyle='#070910';ctx.fillRect(0,0,w,h);history.forEach((frame,fi)=>frame.forEach(o=>{ctx.globalAlpha=(fi+1)/history.length*.55;ctx.fillStyle=o.c;ctx.beginPath();ctx.arc(o.x,o.y,8,0,6.28);ctx.fill()}));ctx.globalAlpha=1;objs.forEach(o=>{ctx.fillStyle=o.c;ctx.beginPath();ctx.arc(o.x,o.y,12,0,6.28);ctx.fill()});requestAnimationFrame(loop)}loop()};

builders.observatory=t=>{const b=$('#toybody');b.innerHTML=head(t,'没有真实星座，也没有考试。点五颗星，把它们变成你自己的图案。')+`<div class="two"><div class="panel"><div class="canvaswrap"><canvas id="oc"></canvas></div><div class="row" style="margin-top:10px"><input class="starname" id="starname" placeholder="给这条星座命名"><button class="primary" id="saveStar">收入星表</button></div></div><div class="panel"><b>你的私人星表</b><div id="catalog" class="log" style="margin-top:12px"></div><button class="ghost" id="newSky" style="margin-top:12px">换一片天空</button></div></div>`;const c=$('#oc');let {ctx,w,h}=fitCanvas(c,590),stars=[],sel=[],alive=true;onCleanup(()=>alive=false);let cat=loadData('stars',[]);function seed(){stars=Array.from({length:65},()=>({x:25+Math.random()*(w-50),y:25+Math.random()*(h-50),r:.7+Math.random()*2.1}));sel=[]}seed();function draw(){if(!alive)return;ctx.fillStyle='#050711';ctx.fillRect(0,0,w,h);stars.forEach((s,i)=>{ctx.fillStyle=sel.includes(i)?'#d8ff72':'#edf2ff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.28);ctx.fill()});if(sel.length>1){ctx.strokeStyle='#d8ff72';ctx.lineWidth=1.3;ctx.beginPath();sel.forEach((i,k)=>{let s=stars[i];k?ctx.lineTo(s.x,s.y):ctx.moveTo(s.x,s.y)});ctx.stroke()}requestAnimationFrame(draw)}draw();c.onclick=e=>{let r=c.getBoundingClientRect(),x=(e.clientX-r.left)*w/r.width,y=(e.clientY-r.top)*h/r.height;let ni=stars.map((s,i)=>({i,d:Math.hypot(s.x-x,s.y-y)})).sort((a,b)=>a.d-b.d)[0];if(ni.d<25&&sel.length<5&&!sel.includes(ni.i)){sel.push(ni.i);beep(400+sel.length*70,.08,'sine',.03)}};function renderCat(){$('#catalog').textContent=cat.map((x,i)=>`${i+1}. ${x}`).join('\n')||'还没有命名星座。'}renderCat();$('#saveStar').onclick=()=>{if(sel.length<3)return;let n=$('#starname').value.trim()||'无名星座 '+(cat.length+1);cat.push(n);saveData('stars',cat);renderCat();$('#starname').value='';sel=[]};$('#newSky').onclick=seed};

builders.lost=t=>{const objects=['一只左手手套','一盘没有标签的磁带','半张游乐园门票','一把打不开任何门的钥匙','一枚写着 2039 的硬币','一张过曝的合照','一颗玻璃弹珠','一本只剩目录的书','一只没有指针的表','一片蓝色羽毛','一封没封口的信','一块旧相机背带'];const fragments=['失主说这不是他的，但他连续三天来问有没有人领走。','物品上没有名字，只有一种很确定的使用痕迹。','监控显示它凌晨两点自己换了一个位置。','登记表写着“请不要追问来源”。','有人留下纸条：如果它被找到，就说明事情还没发生。'];let sel=[];const b=$('#toybody');b.innerHTML=head(t,'点开一件失物，会得到一段不太可靠的登记记录。选两件，还能把它们串成同一件事。')+`<div class="two"><div class="panel"><div class="objectgrid" id="objs"></div></div><div class="panel stack"><div class="quote" id="lostStory">柜台今天很安静。</div><button class="primary" id="combine">把两件失物并案</button><div class="hint">最多选两件。故事是程序拼出来的，偶尔比人类登记员更会胡说。</div></div></div>`;const box=$('#objs');objects.forEach((o,i)=>{let bt=document.createElement('button');bt.className='object';bt.textContent=o;bt.onclick=()=>{if(sel.includes(i))sel=sel.filter(x=>x!==i);else{if(sel.length>=2)sel.shift();sel.push(i)}$$('.object').forEach((x,j)=>x.classList.toggle('sel',sel.includes(j)));$('#lostStory').textContent=`${o}。${fragments[(i+Math.floor(Math.random()*fragments.length))%fragments.length]}`};box.appendChild(bt)});$('#combine').onclick=()=>{if(sel.length<2){$('#lostStory').textContent='先选两件。单独看都很普通，并案以后才容易出事。';return}let a=objects[sel[0]],c=objects[sel[1]];$('#lostStory').textContent=`并案记录：${a} 和 ${c} 曾在同一天下午被不同的人送来。两位登记人都说，他们是在“回去拿忘记的东西”时捡到的。问题是，他们给出的地址完全相同。`}};

builders.reaction=t=>{let results=loadData('react',[]);const b=$('#toybody');b.innerHTML=head(t,'按开始以后等。变绿再点；抢跑会记一次失败。')+`<div class="two"><div><div class="reaction" id="reactBox"><div><div class="huge">●</div><h3 id="reactText">点这里开始</h3></div></div></div><div class="panel stack"><div class="stat"><b id="best">—</b><small>最佳 / ms</small></div><div class="stat"><b id="avg">—</b><small>平均 / ms</small></div><div class="log" id="reactLog"></div></div></div>`;let state='idle',goAt=0,to=null;function stats(){let ok=results.filter(x=>x>0);$('#best').textContent=ok.length?Math.min(...ok):'—';$('#avg').textContent=ok.length?Math.round(ok.reduce((a,b)=>a+b,0)/ok.length):'—';$('#reactLog').textContent=results.slice(-8).reverse().map(x=>x>0?x+' ms':'抢跑').join('\n')}stats();const box=$('#reactBox');box.onclick=()=>{if(state==='idle'||state==='done'){state='wait';box.className='reaction wait';$('#reactText').textContent='等它变绿…';to=setTimeout(()=>{state='ready';goAt=performance.now();box.className='reaction ready';$('#reactText').textContent='现在！'},1200+Math.random()*2500);onCleanup(()=>clearTimeout(to));return}if(state==='wait'){clearTimeout(to);results.push(-1);saveData('react',results);state='done';box.className='reaction fail';$('#reactText').textContent='抢跑。再点一次重来';stats();return}if(state==='ready'){let ms=Math.round(performance.now()-goAt);results.push(ms);saveData('react',results);state='done';box.className='reaction';$('#reactText').textContent=ms+' ms · 再点一次';beep(ms<250?880:520,.1,'square',.04);stats()}}};

builders.ecosystem=t=>{const b=$('#toybody');b.innerHTML=head(t,'绿色是植物，白色是食草者，红色是捕食者。不是科学模型，但会像一个小生态一样自己起伏。')+`<div class="two"><div class="panel"><div class="canvaswrap"><canvas id="ec"></canvas></div></div><div class="panel stack"><label>光照 <input id="light" type="range" min="0" max="100" value="60"></label><label>水分 <input id="water" type="range" min="0" max="100" value="55"></label><label>捕食压力 <input id="pred" type="range" min="0" max="100" value="35"></label><div class="three"><div class="stat"><b id="pn">0</b><small>植物</small></div><div class="stat"><b id="hn">0</b><small>食草者</small></div><div class="stat"><b id="cn">0</b><small>捕食者</small></div></div><button class="ghost" id="resetE">重置生态</button></div></div>`;const c=$('#ec');let {ctx,w,h}=fitCanvas(c,590),plants=[],herb=[],pred=[],alive=true;onCleanup(()=>alive=false);function reset(){plants=Array.from({length:80},()=>({x:Math.random()*w,y:Math.random()*h}));herb=Array.from({length:16},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*1.2,vy:(Math.random()-.5)*1.2,e:80}));pred=Array.from({length:5},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5),vy:(Math.random()-.5),e:100}))}reset();$('#resetE').onclick=reset;let tick=0;function step(){if(!alive)return;tick++;let light=+$('#light').value/100,water=+$('#water').value/100,pressure=+$('#pred').value/100;if(Math.random()<light*water*.22&&plants.length<180)plants.push({x:Math.random()*w,y:Math.random()*h});herb.forEach(hh=>{hh.x=(hh.x+hh.vx+w)%w;hh.y=(hh.y+hh.vy+h)%h;hh.e-=.035;let pi=plants.findIndex(p=>Math.hypot(p.x-hh.x,p.y-hh.y)<12);if(pi>=0){plants.splice(pi,1);hh.e+=8}if(Math.random()<.01){hh.vx+=(Math.random()-.5);hh.vy+=(Math.random()-.5)}});pred.forEach(pp=>{pp.x=(pp.x+pp.vx*(.5+pressure*1.5)+w)%w;pp.y=(pp.y+pp.vy*(.5+pressure*1.5)+h)%h;pp.e-=.05;let hi=herb.findIndex(x=>Math.hypot(x.x-pp.x,x.y-pp.y)<11);if(hi>=0&&Math.random()<pressure*.7){herb.splice(hi,1);pp.e+=18}});if(tick%120===0){if(herb.length<40&&plants.length>35&&Math.random()<.6)herb.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5),vy:(Math.random()-.5),e:70});if(pred.length<12&&herb.length>14&&pressure>.3&&Math.random()<.4)pred.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5),vy:(Math.random()-.5),e:90})}herb=herb.filter(x=>x.e>0);pred=pred.filter(x=>x.e>0);ctx.fillStyle='#09100d';ctx.fillRect(0,0,w,h);ctx.fillStyle='#63b46b';plants.forEach(p=>ctx.fillRect(p.x,p.y,2.5,2.5));ctx.fillStyle='#e8ecef';herb.forEach(x=>{ctx.beginPath();ctx.arc(x.x,x.y,4,0,6.28);ctx.fill()});ctx.fillStyle='#ff765f';pred.forEach(x=>{ctx.beginPath();ctx.arc(x.x,x.y,6,0,6.28);ctx.fill()});if(tick%10===0){$('#pn').textContent=plants.length;$('#hn').textContent=herb.length;$('#cn').textContent=pred.length}requestAnimationFrame(step)}step()};

builders.drum=t=>{const tracks=[['KICK',90],['SNARE',180],['HAT',520],['BEEP',760]],grid=Array.from({length:4},()=>Array(16).fill(false));const b=$('#toybody');b.innerHTML=head(t,'四条轨道，十六步。点亮格子，按播放。')+`<div class="panel stack"><div class="row"><button class="primary" id="playD">▶ 播放</button><button class="ghost" id="clearD">清空</button><label>BPM <input id="bpm" type="range" min="70" max="170" value="112"></label><span id="bpmv" class="small">112</span></div><div class="steps"><div class="stepgrid" id="sg"></div></div></div>`;const sg=$('#sg');tracks.forEach((tr,r)=>{let lab=document.createElement('div');lab.className='labelcell';lab.textContent=tr[0];sg.appendChild(lab);for(let c=0;c<16;c++){let x=document.createElement('button');x.className='cell';x.onclick=()=>{grid[r][c]=!grid[r][c];x.classList.toggle('on',grid[r][c])};sg.appendChild(x)}});let playing=false,step=0,int=null;function restart(){clearInterval(int);if(!playing)return;let ms=60000/+$('#bpm').value/4;int=setInterval(()=>{for(let r=0;r<4;r++)if(grid[r][step])beep(tracks[r][1],r===2?.035:.08,r===0?'sine':'square',r===2?.025:.04);step=(step+1)%16},ms);onCleanup(()=>clearInterval(int))}$('#playD').onclick=()=>{playing=!playing;$('#playD').textContent=playing?'■ 停止':'▶ 播放';restart()};$('#bpm').oninput=e=>{$('#bpmv').textContent=e.target.value;if(playing)restart()};$('#clearD').onclick=()=>{$$('.cell').forEach(x=>x.classList.remove('on'));grid.forEach(r=>r.fill(false))}};

builders.memory=t=>{const b=$('#toybody');b.innerHTML=head(t,'先看它亮，再按同样顺序点回来。每过一轮，多一格。')+`<div class="panel stack"><div class="row"><button class="primary" id="startM">开始</button><span class="small" id="levelM">等级 0</span></div><div class="memory" id="mem"></div></div>`;const box=$('#mem');let cells=[];for(let i=0;i<16;i++){let x=document.createElement('button');x.className='mcell';x.dataset.i=i;box.appendChild(x);cells.push(x)}let seq=[],input=[],accept=false;async function flash(){accept=false;for(const i of seq){cells[i].classList.add('flash');beep(300+i*18,.08,'sine',.025);await new Promise(r=>setTimeout(r,300));cells[i].classList.remove('flash');await new Promise(r=>setTimeout(r,130))}accept=true;input=[]}function next(){seq.push(Math.floor(Math.random()*16));$('#levelM').textContent='等级 '+seq.length;flash()}cells.forEach((c,i)=>c.onclick=()=>{if(!accept)return;input.push(i);c.classList.add('flash');setTimeout(()=>c.classList.remove('flash'),120);let k=input.length-1;if(input[k]!==seq[k]){accept=false;$('#levelM').textContent='错了 · 成绩 '+(seq.length-1);beep(100,.2,'sawtooth',.04);return}if(input.length===seq.length){accept=false;setTimeout(next,650)}});$('#startM').onclick=()=>{seq=[];next()}};

builders.drawers=t=>{const prompts=['拍一张你平时绝不会拍的东西。','找一个完全没有用但很好看的物体。','把今天见到的三个颜色按顺序记下来。','听一首你五年没听过的歌。','关掉所有通知十分钟。','给未来的自己写一句没有解释的话。','把桌上最旧的东西翻到背面看一眼。','站到窗边，找一个移动最慢的东西。','打开相册第 137 张照片，不许往前后翻。','今天故意走一段没走过的小路。','用三个名词描述此刻，不许用形容词。','找一首歌，只听它的鼓。'];let opened=loadData('drawers',Array(12).fill(false));const b=$('#toybody');b.innerHTML=head(t,'抽屉里没有鸡汤，也没有重大人生建议。只有一点点可以立刻做的怪事。')+`<div class="panel"><div class="drawers" id="ds"></div><button class="danger" id="resetDr" style="margin-top:12px">把抽屉重新关上</button></div>`;function r(){const box=$('#ds');box.innerHTML='';prompts.forEach((p,i)=>{let bt=document.createElement('button');bt.className='drawer '+(opened[i]?'opened':'');bt.innerHTML=opened[i]?`<b>${String(i+1).padStart(2,'0')}</b><div class="small" style="margin-top:8px">${p}</div>`:`<b>${String(i+1).padStart(2,'0')}</b><div class="small" style="margin-top:8px">拉开</div>`;bt.onclick=()=>{opened[i]=true;saveData('drawers',opened);r()};box.appendChild(bt)})}r();$('#resetDr').onclick=()=>{opened=Array(12).fill(false);saveData('drawers',opened);r()}};

builders.glitch=t=>{const b=$('#toybody');b.innerHTML=head(t,'输入一句正常的话。下面四台机器会用不同方式把它弄坏。')+`<div class="two"><div class="panel stack"><textarea id="gin" placeholder="例如：我今天原本只想早点睡。"></textarea><div class="row"><button class="primary gm" data-m="cut">删词</button><button class="ghost gm" data-m="mirror">镜像</button><button class="ghost gm" data-m="noise">故障</button><button class="ghost gm" data-m="prophecy">预言</button></div></div><div class="panel"><div class="quote" id="gout">等一句话进来。</div></div></div>`;function trans(s,m){if(!s)return'先给我一句话。';let a=[...s];if(m==='cut')return a.filter((_,i)=>i%3!==1).join('').replace(/，{2,}/g,'，');if(m==='mirror')return a.reverse().join('');if(m==='noise'){const marks=['▓','·','//','_','?'];return a.map((x,i)=>i%4===0?x+marks[i%marks.length]:x).join('')}let parts=s.split(/[，。！？]/).filter(Boolean);return `后来人们才知道，${parts[0]||s}；而真正重要的，是当时没人注意到的那一小段沉默。`}$$('.gm').forEach(bt=>bt.onclick=()=>$('#gout').textContent=trans($('#gin').value,bt.dataset.m))};

builders.illusion=t=>{const b=$('#toybody');b.innerHTML=head(t,'不是“相信眼睛”还是“相信尺子”的二选一。你可以亲手把背景拿掉，再比较一次。')+`<div class="panel stack"><div class="illusionTabs"><button class="active" data-i="muller">箭头线</button><button data-i="ebbing">圆圈</button><button data-i="contrast">明暗</button></div><div class="canvaswrap"><canvas id="ic"></canvas></div><div class="row"><label>拆解程度 <input id="is" type="range" min="0" max="100" value="0"></label><span class="small">拖到最右，看错觉线索逐渐消失。</span></div></div>`;const c=$('#ic');let {ctx,w,h}=fitCanvas(c,520),mode='muller',alive=true;onCleanup(()=>alive=false);$$('.illusionTabs button').forEach(bt=>bt.onclick=()=>{$$('.illusionTabs button').forEach(x=>x.classList.remove('active'));bt.classList.add('active');mode=bt.dataset.i});function loop(){if(!alive)return;let s=+$('#is').value/100;ctx.fillStyle='#101319';ctx.fillRect(0,0,w,h);if(mode==='muller'){ctx.strokeStyle='#f1f1e8';ctx.lineWidth=4;let x1=w*.2,x2=w*.8,y1=190,y2=330;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y1);ctx.moveTo(x1,y2);ctx.lineTo(x2,y2);ctx.stroke();ctx.globalAlpha=1-s;[[x1,y1,-1],[x2,y1,1],[x1,y2,1],[x2,y2,-1]].forEach(([x,y,d])=>{ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+d*35,y-25);ctx.moveTo(x,y);ctx.lineTo(x+d*35,y+25);ctx.stroke()});ctx.globalAlpha=1;ctx.fillStyle='#9da1ad';ctx.fillText('两条水平线实际等长',20,40)}else if(mode==='ebbing'){let cy=260;ctx.fillStyle='#d8ff72';ctx.beginPath();ctx.arc(w*.32,cy,32,0,6.28);ctx.fill();ctx.beginPath();ctx.arc(w*.68,cy,32,0,6.28);ctx.fill();ctx.globalAlpha=1-s;for(let k=0;k<8;k++){let a=k*Math.PI/4;ctx.fillStyle='#d0d3db';ctx.beginPath();ctx.arc(w*.32+Math.cos(a)*85,cy+Math.sin(a)*85,22,0,6.28);ctx.fill();ctx.beginPath();ctx.arc(w*.68+Math.cos(a)*68,cy+Math.sin(a)*68,8,0,6.28);ctx.fill()}ctx.globalAlpha=1;ctx.fillStyle='#9da1ad';ctx.fillText('中间两个绿色圆实际一样大',20,40)}else{ctx.fillStyle='#eee';ctx.fillRect(0,0,w/2,h);ctx.fillStyle='#20242b';ctx.fillRect(w/2,0,w/2,h);ctx.fillStyle=`rgba(120,120,120,1)`;ctx.fillRect(w*.25-45,h/2-45,90,90);ctx.fillRect(w*.75-45,h/2-45,90,90);ctx.globalAlpha=1-s;ctx.fillStyle='rgba(255,210,80,.15)';ctx.fillRect(w/2,0,w/2,h);ctx.globalAlpha=1;ctx.fillStyle='#9da1ad';ctx.fillText('两个中间方块使用同一灰色',20,40)}requestAnimationFrame(loop)}loop()};
</script>
