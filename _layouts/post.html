---
layout: default
---
<link rel="stylesheet" href="{{ '/assets/css/portfolio.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/portfolio-media.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/home.css' | relative_url }}">
<article class="post-shell">
  <div class="post-header">
    <p class="home-kicker">{{ page.category | default: '记录' }}</p>
    <h1>{{ page.title }}</h1>
    <time>{{ page.date | date: '%Y.%m.%d' }}</time>
  </div>
  <div class="post-body">{{ content }}</div>
  <footer class="post-end"><a href="{{ '/notes' | relative_url }}">← 返回随笔与记录</a></footer>
</article>
